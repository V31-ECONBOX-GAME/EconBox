version=0.1.0
group=com.econbox

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED

buildJavaVersion=25
runtimeJavaVersion=25

# libGDX and its natives-desktop artifacts must always move together; a mismatch
# between them compiles cleanly and then fails at runtime inside JNI.
gdxVersion=1.14.2
ashleyVersion=1.7.4

# LWJGL3 arrives transitively through gdx-backend-lwjgl3. 3.4.1 is the first release
# that declares its native access, so anything older warns on every launch under Java 24+.
lwjglVersion=3.4.1

construoVersion=2.2.2

# JDK that construo downloads and bundles into the packaged builds. Must match
# runtimeJavaVersion, or the packaged runtime rejects this project's bytecode.
jdkBundleVersion=25.0.4+7
