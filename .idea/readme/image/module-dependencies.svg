<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">EconBox Module Dependency Diagram</title>
  <desc id="desc">The lwjgl3 desktop module depends on core; core never depends on lwjgl3. A buildSrc convention plugin is applied to both modules by the root build.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="#f8fafc"/>

  <text x="600" y="58" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#0f172a">EconBox Module Dependencies</text>
  <text x="600" y="92" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#64748b">Desktop only. The split exists so backend imports cannot leak into game logic.</text>

  <rect x="58" y="124" width="1084" height="556" rx="18" fill="#ffffff" stroke="#e2e8f0" filter="url(#soft-shadow)"/>

  <!-- lwjgl3 -->
  <g id="lwjgl3">
    <rect x="110" y="186" width="420" height="300" rx="14" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    <text x="320" y="228" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" fill="#9a3412">lwjgl3</text>
    <text x="320" y="252" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#c2410c">desktop launcher &#183; Windows / macOS / Linux</text>
    <text x="142" y="294" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#7c2d12">Lwjgl3Launcher &#8212; main(), window setup</text>
    <text x="142" y="322" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#7c2d12">StartupHelper &#8212; per-OS startup fixes</text>
    <text x="142" y="350" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#7c2d12">src/main/resources &#8212; assets ship from here</text>
    <text x="142" y="378" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#7c2d12">gdx-backend-lwjgl3</text>
    <text x="142" y="406" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#7c2d12">gdx / freetype / box2d &#8212; natives-desktop</text>
    <text x="142" y="434" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#7c2d12">construo &#8212; packaging with a bundled JDK</text>
    <text x="142" y="462" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-style="italic" fill="#a16207">knows it is running on a desktop</text>
  </g>

  <!-- core -->
  <g id="core">
    <rect x="670" y="186" width="420" height="300" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="880" y="228" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" fill="#1e40af">core</text>
    <text x="880" y="252" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1d4ed8">game logic &#183; platform independent</text>
    <text x="702" y="294" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#1e3a8a">EconBoxGame &#8212; the shared Game subclass</text>
    <text x="702" y="322" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#1e3a8a">FirstScreen &#8212; pixel-art demo screen</text>
    <text x="702" y="350" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#1e3a8a">gdx &#8212; Java API only</text>
    <text x="702" y="378" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#1e3a8a">gdx-freetype &#8212; Java API only</text>
    <text x="702" y="406" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#1e3a8a">gdx-box2d &#8212; Java API only</text>
    <text x="702" y="434" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#1e3a8a">ashley &#8212; entity component system</text>
    <text x="702" y="462" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-style="italic" fill="#3b82f6">must not import a backend package</text>
  </g>

  <!-- allowed direction -->
  <path d="M542,288 L658,288" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)" fill="none"/>
  <text x="600" y="276" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#2563eb">depends on</text>

  <!-- forbidden direction -->
  <path d="M658,392 L546,392" stroke="#dc2626" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow-red)" fill="none"/>
  <text x="600" y="418" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#dc2626">never</text>

  <!-- build logic -->
  <path d="M320,544 L320,494" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-gray)" fill="none"/>
  <path d="M880,544 L880,494" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-gray)" fill="none"/>
  <rect x="110" y="548" width="980" height="88" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="582" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#334155">buildSrc &#8212; com.econbox.conventions</text>
  <text x="600" y="608" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#64748b">Java 25 toolchain, UTF-8 encoding, JUnit Platform. Applied to every subproject by the root build.</text>
</svg>
